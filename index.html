<style>:root{
  --bg:#0c0809;--panel:#1b1213;--panel2:#231718;--line:#4a3426;--gold:#d6a84f;--gold2:#f3d38a;
  --ember:#ff6a2a;--ember2:#ffb347;--text:#eadfc8;--mute:#a8957a;--good:#7fc46a;--bad:#ff6b5b;--arcane:#a98bff;
  --font-h:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;--font-b:Georgia,'Iowan Old Style','Palatino',serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --nav-h:58px;--top-h:64px;--vh:1vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--font-b);font-size:16px;line-height:1.4;overscroll-behavior-y:none}
body{background:radial-gradient(ellipse at top,#2a1210 0%,var(--bg) 60%);min-height:100vh;min-height:100dvh;touch-action:manipulation}
a{color:var(--ember2)}
h1,h2,h3{font-family:var(--font-h);letter-spacing:.04em;margin:.2em 0 .5em;color:var(--gold2)}
h2{font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:.35em;display:flex;align-items:center;gap:.5em}
h3{font-size:1rem}
.hidden{display:none!important}
button,.btn{font-family:var(--font-h);font-weight:700;letter-spacing:.04em;border:1px solid #8a5a2b;color:#fff3dc;cursor:pointer;
  background:linear-gradient(#7a2a16,#4a140c);padding:.6em 1em;border-radius:6px;box-shadow:inset 0 1px 0 #c0663a55,0 2px 0 #000;
  font-size:.82rem;text-transform:uppercase;min-height:44px;min-width:44px;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.3em}
button:active,.btn:active{transform:translateY(1px);filter:brightness(1.25)}
button.alt{background:linear-gradient(#3a2c22,#211813);border-color:var(--line)}
button.arc{background:linear-gradient(#4c2f8a,#24164a);border-color:#7d62c9}
button.gold{background:linear-gradient(#b8862d,#6e4b12);border-color:#e4bd6b;color:#1b1004}
button.sm{padding:.4em .7em;font-size:.72rem;min-height:40px}
button.wide{width:100%}
button:disabled{opacity:.45;filter:none}
input,select,textarea{font-family:var(--font-b);font-size:16px;background:#0f0a0a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.6em .7em;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}

  // ---------- world clock ----------

      for (let i = 2; i >= 0 && rem > 0; i--) { const e = it[i] < rem ? it[i] : rem; if (e > 0) { b += e * X.tiers[i].bonus; rem -= e; eqd += e; } }
      o[X.stat] += b; if (detail) o.per[u] = { equipped: eqd, bonus: b };
    }
    return o;
  }
  equipDiscount(k) { return Math.min(0.25, (k.buildings.armory || 0) * 0.01); }
  equipCost(k, u, tier) { return Math.round(D.EQUIP[u].tiers[tier].cost * (1 - this.equipDiscount(k))); }
  equipStatus(k) {
    const out = {}, eb = this.equipBonus(k, true), arm = k.buildings.armory || 0;
    for (const u in D.EQUIP) {
      const X = D.EQUIP[u], it = this.equipItems(k, u), units = k.units[u] || 0, owned = it[0] + it[1] + it[2];
      const per = eb.per[u] || { equipped: 0, bonus: 0 };
      out[u] = {
        unit: D.UNITS[u].name, slot: X.slot, stat: X.stat, units, owned, equipped: per.equipped, bonus: per.bonus, need: Math.max(0, units - per.equipped),
        tiers: X.tiers.map((t, i) => {
          const cost = this.equipCost(k, u, i), room = Math.max(0, units - it.slice(i).reduce((a, v) => a + v, 0));
          return { name: t.name, bonus: t.bonus, cost, have: it[i], unlocked: arm >= t.armories, needArmories: t.armories, room, max: arm >= t.armories ? Math.min(room, Math.floor(k.gold / cost)) : 0 };
        })
      };
    }
    return out;
  }
  buyEquip(k, u, tier, amount) {
    this.settle(k);
    const X = D.EQUIP[u]; if (!X || !X.tiers[tier]) throw new GameError('Unknown equipment');
    const T = X.tiers[tier];
    if ((k.buildings.armory || 0) < T.armories) throw new GameError(`${T.name} needs ${T.armories} Armor${T.armories > 1 ? 'ies' : 'y'}`);
    const st = this.equipStatus(k)[u].tiers[tier], cost = st.cost;
    if (amount === 'max') amount = st.max;
    amount = Math.floor(+amount || 0);
    if (st.room <= 0) throw new GameError(`Every one of your ${D.UNITS[u].name} already has ${T.name} or better. Train more ${D.UNITS[u].name} first.`);
    if (amount < 1) throw new GameError(k.gold < cost ? `Not enough gold (need ${fmt(cost)} each)` : 'Enter an amount');
    if (amount > st.room) throw new GameError(`Only ${fmt(st.room)} ${D.UNITS[u].name} can use more ${T.name} (1 item per unit)`);
    if (k.gold < amount * cost) throw new GameError(`Not enough gold: ${fmt(amount * cost)} needed`);
    k.gold -= amount * cost; this.equipItems(k, u)[tier] += amount;
    this.calc(k);
    return `Forged ${fmt(amount)} ${T.name}${amount > 1 ? 's' : ''} for ${fmt(amount * cost)} gold.`;
  }
  loseEquip(k, u, n, have) {
    const it = k.equip && k.equip[u]; if (!it || !have) return 0;
    const frac = Math.min(1, n / have); let d = 0;
    for (let i = 0; i < 3; i++) { const x = Math.min(it[i], Math.round(it[i] * frac)); it[i] -= x; d += x; }
    return d;
  }
  lossText(o) { const e = Object.entries(o); return e.length ? e.map(([u, n]) => `${fmt(n)} ${D.UNITS[u].name}`).join(', ') : 'none'; }
  trimBuildings(k) {
    let over = Object.values(k.buildings).reduce((a, v) => a + v, 0) - k.land;
    const keys = Object.keys(k.buildings);
    while (over > 0) { const b = pick(keys.filter(x => k.buildings[x] > 0)); if (!b) break; k.buildings[b]--; over--; }
  }
  saveReport(r, ks) {
    const p = ks.find(k => !k.isBot); if (!p) return;
    this.W.reports[r.id] = r;
    p.reports = p.reports || []; p.reports.unshift(r.id);
    while (p.reports.length > 60) delete this.W.reports[p.reports.pop()];
    this.emit('report', { id: r.id, mine: r.attackerId === p.id });
  }
  spy(a, targetId) {
    const t = this.k(targetId); this.settle(a); this.settle(t);
    if (a.id === t.id) throw new GameError('You know your own realm');
    if (a.turns < CFG.SPY_TURNS) throw new GameError(`Spying costs ${CFG.SPY_TURNS} turns`);
    if (!a.units.shade) throw new GameError('Train some Shades first');
    a.turns -= CFG.SPY_TURNS;
    const ca = this.calc(a), ct = this.calc(t);
    const ok = ca.spy * rnd(0.8, 1.2) > ct.sentry;
    const r = { id: this.id('r'), kind: 'spy', tick: this.W.tick, time: this.now(), attackerId: a.id, attackerName: a.name, defenderId: t.id, defenderName: t.name, win: ok, lines: [] };
    if (ok) {
      a.stats.spiesWon++;
      r.intel = { units: { ...t.units }, buildings: { ...t.buildings }, gold: Math.round(t.gold), food: Math.round(t.food), mana: Math.round(t.mana), land: t.land, offense: ct.offense, defense: ct.defense, spy: ct.spy, sentry: ct.sentry, research: { ...t.research } };
      r.lines.push(`Your Shades slipped past the watch of ${t.name} and returned with full intelligence.`);
    } else {
      const lost = Math.max(1, Math.round(a.units.shade * rnd(0.05, 0.1)));
      a.units.shade -= Math.min(lost, a.units.shade);
      r.lines.push(`The Watchers of ${t.name} caught the Shades of ${a.name}. ${lost} were lost.`);
      this.note(t, `Your Watchers caught Shades sent by ${a.name}.`, 'good');
      if (t.isBot && !a.isBot && chance(0.3)) this.queue(rint(30, 300) * 1000, { type: 'mail', from: t.id, to: a.id, subject: 'Shades', body: pick(['My Watchers caught your Shades. Try that again and I will answer with steel.', 'I found your little spies, ' + a.ruler + '. Their heads are on my gate.', 'caught ur spies lol', 'Spying on me? Bold.']) });
    }
    if (ok || !a.isBot || !t.isBot) this.saveReport(r, [a, t]);
    return r;
  }
  cast(a, spell, targetId) {
    const S = D.SPELLS[spell]; if (!S) throw new GameError('Unknown spell');
    this.settle(a);
    const m = this.mods(a), cost = Math.round(S.mana * (1 - m.spellDiscount));
    if (a.mana < cost) throw new GameError(`Needs ${cost} mana`);
    if (S.self) {
      a.mana -= cost;
      a.effects = a.effects.filter(e => e.spell !== spell);
      a.effects.push({ spell, name: S.name, stat: S.effect, amount: S.amount, until: this.W.tick + S.ticks });

    }
    const t = this.k(targetId); this.settle(t); this.canTarget(a, t);
    if (a.turns < S.turns) throw new GameError(`Needs ${S.turns} turns`);

    const am = (a.units.mage || 0) * (1 + m.mana) + 5, tm = (t.units.mage || 0) * 0.8 + 10;
    const ok = Math.random() < clamp(0.55 + (am - tm) / (am + tm) * 0.35, 0.15, 0.9);
    const r = { id: this.id('r'), kind: 'spell', spell: S.name, tick: this.W.tick, time: this.now(), attackerId: a.id, attackerName: a.name, defenderId: t.id, defenderName: t.name, win: ok, lines: [] };
    if (ok) {
      if (spell === 'cinderhail') { const n = Math.round(t.units.warden * rnd(0.02, 0.04)); t.units.warden -= n; r.lines.push(`Cinder Hail scorches ${t.name}: ${fmt(n)} Wardens burn.`); }
      if (spell === 'blight') { const n = Math.round(t.food * rnd(0.10, 0.15)); t.food -= n; r.lines.push(`Ashen Blight rots ${fmt(n)} food in the granaries of ${t.name}.`); }
      this.note(t, `${a.name} cast ${S.name} on you!`, 'bad');
    } else { r.lines.push(`The Embermages of ${t.name} unravel the ${S.name} of ${a.name}.`); this.note(t, `Your mages warded off ${S.name} from ${a.name}.`, 'good'); }
    this.saveReport(r, [a, t]);
    if (t.isBot) t.grudge = a.id;
    return { msg: r.lines[0], report: r };
  }

  // ---------- Embergates (PvE) ----------
  gateTick() {
    const W = this.W, g = W.gate;
    if (g && g.status === 'open' && W.tick >= g.closesAt) this.gateSpill(g);
    if ((!W.gate || W.gate.status !== 'open') && W.tick >= W.nextGateTick) this.openGate();
  }
  openGate() {
    const W = this.W;
    const hp = Math.round(Math.max(8000, (this._topOff || 0) * 0.6 * rnd(5.5, 10.5) * (W.difficulty === 'easy' ? 0.85 : W.difficulty === 'hard' ? 1.15 : 1)));
    W.gate = { id: this.id('g'), name: pick(D.GATE_NAMES), lord: pick(D.GATE_LORDS), hp, maxHp: hp, openedAt: W.tick, closesAt: W.tick + CFG.GATE_DURATION, status: 'open', contrib: {} };
    W.nextGateTick = W.gate.closesAt + this.gateGap();
    this.news(`An Embergate has torn open: ${W.gate.name}! ${W.gate.lord} leads the Hollow Host. Seal it within ${CFG.GATE_DURATION} ticks or it will spill over.`, 'gate');
    this.react('gateOpen', { gate: W.gate.name, lord: W.gate.lord }, { n: rint(1, 3) });
    this.emit('gate', this.gatePublic());
  }
  gateGap() { return Math.max(2, Math.round(rint(CFG.GATE_INTERVAL, CFG.GATE_INTERVAL * 2) / (this.omen().mods.gateRate ? 2 : 1))); }
  gatePublic() {
    const g = this.W.gate; if (!g) return { nextGateTick: this.W.nextGateTick, status: 'none' };
    const top = Object.entries(g.contrib).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, dmg]) => ({ id, name: this.W.kingdoms[id] ? this.W.kingdoms[id].name : '?', dmg }));
    return { ...g, contrib: undefined, top, mine: g.contrib[this.W.playerId] || 0, ticksLeft: Math.max(0, g.closesAt - this.W.tick), nextGateTick: this.W.nextGateTick };
  }
  assaultGate(k) {
    const g = this.W.gate; this.settle(k);
    if (!g || g.status !== 'open') throw new GameError('No Embergate is open right now');
    if (k.turns < CFG.GATE_TURNS) throw new GameError(`Assaulting the gate costs ${CFG.GATE_TURNS} turns`);
    const c = this.calc(k); if (c.offense < 1) throw new GameError('You have no fighting force');
    k.turns -= CFG.GATE_TURNS;
    const dmg = Math.min(g.hp, Math.round(c.offense * rnd(0.7, 1.3) * 0.6));
    const lost = Math.round((k.units.vanguard || 0) * rnd(0.01, 0.03)); k.units.vanguard -= lost;
    g.hp -= dmg; g.contrib[k.id] = (g.contrib[k.id] || 0) + dmg; k.stats.gateDamage += dmg; k.renown += 3;
    let msg = `Your forces strike ${g.name} for ${fmt(dmg)} damage, losing ${fmt(lost)} Vanguard to the Hollow Host.`;
    if (g.hp <= 0) msg += ' ' + this.sealGate(g, k);
    this.emit('gate', this.gatePublic());
    return msg;
  }
  sealGate(g, finisher) {
    const W = this.W;
    g.status = 'sealed'; g.hp = 0; W.nextGateTick = W.tick + this.gateGap();
    const pool = Math.round(g.maxHp * 1.5), total = Object.values(g.contrib).reduce((a, v) => a + v, 0);
    for (const [id, dmg] of Object.entries(g.contrib)) {
      const k = W.kingdoms[id]; if (!k) continue;
      const share = dmg / total, gold = Math.round(pool * share), renown = Math.round(20 + 200 * share), mana = Math.round(40 + 200 * share);
      k.gold += gold; k.renown += renown; k.mana += mana; k.stats.gatesSealed++;
      this.note(k, `${g.name} is sealed! Your share of the spoils: ${fmt(gold)} gold, ${mana} mana, ${renown} renown.`, 'good');
    }
    finisher.renown += 50;
    W.gateHistory.unshift({ name: g.name, lord: g.lord, sealedBy: finisher.name, tick: W.tick, time: this.now(), result: 'sealed', took: W.tick - g.openedAt, helpers: Object.keys(g.contrib).length });
    if (W.gateHistory.length > 30) W.gateHistory.length = 30;
    this.news(`${finisher.name} struck the final blow and sealed ${g.name}! ${g.lord} is banished to the Cinderdeep.`, 'gate');
    this.react('gateSeal', { gate: g.name, name: finisher.name }, { n: rint(0, 2), exclude: [finisher.id] });

  }

    const W = this.W;

    const victims = [];
    for (let i = 0; i < 6; i++) { const v = pick(this.bots); if (v && !victims.includes(v)) victims.push(v); }
    const p = this.player();
    if (p && !this.isProtected(p) && chance(0.04)) victims[0] = p;
    for (const k of victims) {
      this.settle(k);

    this.news(`${g.name} was not sealed in time. The Hollow Host poured out and ravaged ${victims.map(v => v.name).join(', ')}.`, 'gate');
    this.react('gateSpill', { gate: g.name }, { n: rint(0, 2) });
    this.emit('gate', this.gatePublic());
  }

  // ---------- covenants ----------
  createGuildRaw(k, name, tag, desc) {
    const id = this.id('g');
    this.W.guilds[id] = { id, name, tag: tag.toUpperCase(), desc: desc || '', leader: k.id, members: [k.id], created: this.now(), policy: 'apply', minMight: 0, apps: [], invites: [] };
    k.guildId = id; this.W.chat['guild:' + id] = [];
    return this.W.guilds[id];
  }
  joinGuildRaw(k, g) {
    if (!g.members.includes(k.id)) g.members.push(k.id);
    k.guildId = g.id; g.apps = g.apps.filter(a => a.id !== k.id); g.invites = g.invites.filter(x => x !== k.id);
    for (const o of Object.values(this.W.guilds)) if (o !== g) { o.apps = o.apps.filter(a => a.id !== k.id); }
  }
  leaveGuildRaw(k) {
    const g = this.W.guilds[k.guildId]; if (!g) return null;
    g.members = g.members.filter(id => id !== k.id); k.guildId = null;
    if (!g.members.length) { delete this.W.guilds[g.id]; delete this.W.chat['guild:' + g.id]; this.news(`The covenant ${g.name} [${g.tag}] has disbanded.`, 'guild'); return g; }
    if (g.leader === k.id) {
      const next = g.members.map(id => this.W.kingdoms[id]).sort((a, b) => (b._might || 0) - (a._might || 0))[0];
      g.leader = next.id;
      if (this.myGuild() === g) this.guildSys(g, `${next.ruler} of ${next.name} now leads the covenant.`);
    }
    return g;
  }
  guildMight(g) { let s = 0; for (const id of g.members) { const k = this.W.kingdoms[id]; if (k) s += k._might || this.calc(k).might; } return s; }
  myGuild() { const p = this.player(); return p && p.guildId ? this.W.guilds[p.guildId] : null; }
  guildSys(g, text) { this.pushChat('guild:' + g.id, { id: this.id('c'), channel: 'guild:' + g.id, time: this.now(), sys: true, text }); }
  createGuild(k, name, tag, desc, policy = 'apply') {
    name = String(name || '').trim().slice(0, 40); tag = String(tag || '').trim().replace(/[^A-Za-z0-9]/g, '').slice(0, 5);
    if (k.guildId) throw new GameError('Leave your current covenant first');
    if (name.length < 3) throw new GameError('Covenant name must be at least 3 characters');
    if (tag.length < 2) throw new GameError('Tag must be 2-5 letters or numbers');
    if (Object.values(this.W.guilds).some(g => g.name.toLowerCase() === name.toLowerCase() || g.tag === tag.toUpperCase())) throw new GameError('That name or tag is taken');
    this.settle(k);
    if (k.gold < CFG.GUILD_COST) throw new GameError(`Founding a covenant costs ${fmt(CFG.GUILD_COST)} gold`);
    k.gold -= CFG.GUILD_COST;
    const g = this.createGuildRaw(k, name, tag, String(desc || '').slice(0, 200));
    g.policy = ['open', 'apply', 'invite'].includes(policy) ? policy : 'apply';
    for (const o of Object.values(this.W.guilds)) o.apps = o.apps.filter(a => a.id !== k.id);
    this.news(`${k.name} founded the covenant ${g.name} [${g.tag}].`, 'guild');
    this.guildSys(g, `${k.ruler} founded ${g.name}. Invite realms from their profile, or wait for applications.`);
    const fans = this.onlineBots().filter(b => !b.guildId).slice(0, 40);
    for (let i = 0, n = rint(1, 3); i < n && fans.length; i++) {
      const b = fans.splice(Math.floor(Math.random() * fans.length), 1)[0];
      this.queue(rint(20, 240) * 1000, { type: 'chatline', from: b.id, ch: 'global', kind: 'interest', vars: { to: k.ruler, tag: g.tag } });
    }
    return g;
  }
  applyGuild(k, gid, note = '') {
    const g = this.W.guilds[gid]; if (!g) throw new GameError('No such covenant');
    if (k.guildId) throw new GameError('Leave your current covenant first');
    if (g.members.length >= CFG.GUILD_MAX) throw new GameError('That covenant is full');
    if (g.invites.includes(k.id)) return this.acceptInvite(k, gid);
    if (g.policy === 'invite') throw new GameError(`${g.name} is invite-only. Send its leader a raven.`);
    if (g.policy === 'open') { this.joinGuildRaw(k, g); this.welcomePlayer(g, k); return { joined: true, msg: `You swore oaths to ${g.name} [${g.tag}].` }; }
    if (g.apps.some(a => a.id === k.id)) throw new GameError('Your application is already waiting');
    g.apps.push({ id: k.id, time: this.now(), note: String(note).slice(0, 200) });
    const leader = this.W.kingdoms[g.leader], online = this.isOnline(leader);
    this.queue((online ? rint(30, 300) : rint(600, 2400)) * 1000, { type: 'apply', gid: g.id, kid: k.id });
    return { joined: false, msg: `Application sent to ${g.name}. ${leader.ruler} will answer ${online ? 'soon' : 'when they are next online'}.` };
  }
  cancelApp(k, gid) { const g = this.W.guilds[gid]; if (g) g.apps = g.apps.filter(a => a.id !== k.id); return 'Application withdrawn.'; }
  invitesFor(k) { return Object.values(this.W.guilds).filter(g => g.invites.includes(k.id)); }
  acceptInvite(k, gid) {
    const g = this.W.guilds[gid]; if (!g || !g.invites.includes(k.id)) throw new GameError('That invitation is gone');
    if (k.guildId) throw new GameError('Leave your current covenant first');
    if (g.members.length >= CFG.GUILD_MAX) throw new GameError('That covenant is full');
    this.joinGuildRaw(k, g); this.welcomePlayer(g, k);
    return { joined: true, msg: `You joined ${g.name} [${g.tag}].` };
  }
  declineInvite(k, gid) { const g = this.W.guilds[gid]; if (g) g.invites = g.invites.filter(x => x !== k.id); return 'Invitation declined.'; }
  leaveGuild(k) {
    const g = this.W.guilds[k.guildId]; if (!g) throw new GameError('You are not in a covenant');
    const name = g.name;
    this.leaveGuildRaw(k);
    if (this.W.guilds[g.id]) { this.guildSys(g, `${k.ruler} of ${k.name} has left the covenant.`); this.news(`${k.name} broke their oath to ${g.name} [${g.tag}].`, 'guild'); }
    return `You left ${name}.`;
  }
  requireLeader(k) { const g = this.W.guilds[k.guildId]; if (!g) throw new GameError('You are not in a covenant'); if (g.leader !== k.id) throw new GameError('Only the covenant leader can do that'); return g; }
  inviteToGuild(k, botId) {
    const g = this.requireLeader(k), b = this.k(botId);
    if (!b.isBot) throw new GameError('Invalid target');
    if (b.guildId === g.id) throw new GameError(`${b.name} is already sworn to you`);
    if (g.members.length + g.invites.length >= CFG.GUILD_MAX + 5) throw new GameError('Too many open invitations');
    if (g.members.length >= CFG.GUILD_MAX) throw new GameError('Your covenant is full');
    if (g.invites.includes(b.id)) throw new GameError('Invitation already sent');
    g.invites.push(b.id);
    this.queue((this.isOnline(b) ? rint(20, 240) : rint(600, 3600)) * 1000, { type: 'invite', gid: g.id, kid: b.id });
    return `Invitation sent to ${b.ruler} of ${b.name}. Expect a raven with their answer.`;
  }
  answerApplication(k, botId, accept) {
    const g = this.requireLeader(k), app = g.apps.find(a => a.id === botId);
    if (!app) throw new GameError('That application is gone');
    g.apps = g.apps.filter(a => a.id !== botId);
    const b = this.W.kingdoms[botId]; if (!b) throw new GameError('That realm is gone');
    if (!accept) { this.queue(rint(5, 60) * 1000, { type: 'chatline', from: b.id, ch: 'dm', to: k.id, text: pick(['Your loss.', 'Fair enough. Good luck.', 'ok, maybe later then', 'Hm. Another covenant will have me.']) }); return `You declined ${b.name}.`; }
    if (b.guildId) throw new GameError(`${b.name} already joined another covenant`);
    if (g.members.length >= CFG.GUILD_MAX) throw new GameError('Your covenant is full');
    this.joinGuildRaw(b, g);
    this.guildSys(g, `${b.ruler} of ${b.name} joined the covenant.`);
    this.queue(rint(3, 30) * 1000, { type: 'chatline', from: b.id, ch: 'guild:' + g.id, kind: 'joinedClan', vars: { clan: g.name } });
    this.news(`${b.name} swore oaths to ${g.name} [${g.tag}].`, 'guild');
    return `${b.name} joined ${g.name}.`;
  }
  kickMember(k, id) {
    const g = this.requireLeader(k); if (id === k.id) throw new GameError('Leave instead');

        req.onsuccess = () => resolve(req.result);

  }

// ---------- persistence ----------
let saving = false;
// A save requested while another is being written is queued (not dropped), and changes made during a
// write keep the realm dirty, so the newest state always reaches storage.
let savingP = null, saveAgain = false;
async function save(force) {
  if (!S.E) return;
  if (saving) { if (force || S.dirty) saveAgain = true; return savingP; }
  if (!S.dirty && !force) return;
  saving = true; S.dirty = false;
  savingP = (async () => {
    try { S.E.W.savedAt = Date.now(); await Store.save(S.E.serialize()); S.savedAt = Date.now(); }
    catch (e) { S.dirty = true; toast(e.message, 'err'); }
    finally { saving = false; }
    if (saveAgain) { saveAgain = false; await save(true); }
  })();
  return savingP;
}
function exportSave() {
  const json = S.E.serialize(), p = S.E.player();
  const name = `embergate-${(p.name || 'save').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${new Date().toISOString().slice(0, 10)}.json`;
  return { json, name };
}

// ---------- boot ----------
async function boot() {

  }
  if (!S.E || !S.E.player()) return renderCreate();

  await catchUp(true);

}
function migrationNotice() {
  const m = S.E && S.E.W.flags && S.E.W.flags.migrated; if (!m || !m.notice) return;
  // cleared only once the note has been on screen a while (or dismissed), so an update reload right after migration doesn't swallow it
  const done = () => { if (m.notice) { m.notice = false; S.dirty = true; } };
  setTimeout(() => { const b = document.querySelector('#sheet [data-close]'); if (b) b.addEventListener('click', done); setTimeout(done, 8000); }, 600);
  setTimeout(() => sheet(`<h2>⚜ Embergate ${VERSION}</h2><p class="small">Your realm was carried over from the previous version. Nothing was lost: your gold, land, army, covenant, ravens and chat history are all here.</p>
    <ul class="small"><li>Ticks are <b>1 minute</b> again (+${CFG.TURNS_PER_TICK} turn and a tick of income each); timers such as your Novice Ward, spells and the Embergate keep their real time.</li>${m.botsAfter !== m.botsBefore ? `<li>The province grew from ${n(m.botsBefore)} to <b>${n(m.botsAfter)}</b> rulers.</li>` : `<li>${n(m.botsAfter)} rulers share the province.</li>`}<li>New: Armory (Army tab), daily deposit limit (80%), profiles with bio &amp; picture (More › My profile), Hard difficulty (Settings), smarter Tavern replies.</li><li>Attacks now cost ${CFG.ATTACK_TURNS} turns; the Gate still costs ${CFG.GATE_TURNS}.</li></ul>

function hookEngine() {

    else if (type === 'gate' && (S.view === 'gate' || S.view === 'citadel')) S.needRender = true;

}
function snapshot() {
  const E = S.E, p = E.player(); E.settle(p);
  let unread = 0; for (const id in E.W.mail) { const m = E.W.mail[id]; if (m.to === p.id && !m.read) unread++; }
  return { gold: p.gold + p.vault, land: p.land, rank: E.myRank(), notes: (p.notes || []).length ? p.notes[0] : null, reports: (p.reports || [])[0], unread, chat: (E.W.chat.global || []).length ? E.W.chat.global[E.W.chat.global.length - 1].id : null, tick: E.W.tick, ms: Date.now() };
}
async function catchUp(initial) {
  const E = S.E; if (S.catching) return; S.catching = true;
  const owed = E.owedTicks(), skipped = E.W.skippedTicks || 0; E.W.skippedTicks = 0;
  if (owed < 2) { S.catching = false; if (initial) renderShell(); return; }
  const before = snapshot(), awayMs = owed * TK();
  const big = owed > 30;
  if (big) {
    $('#catch') && $('#catch').remove();
    const ov = document.createElement('div'); ov.className = 'catch'; ov.id = 'catch';
    ov.innerHTML = `<h2>⧗ The world moves on</h2><p class="mute">Simulating ${dur(awayMs)} in ${n(E.bots.length)} realms…</p><div class="bar"><i id="cu-bar" style="width:0%"></i></div><p class="small mute" id="cu-txt">0%</p>`;
    document.body.appendChild(ov);
  }
  const t0 = performance.now(); let lastTxt = 0;
  await E.runTo(E.W.tick + owed, (f, done) => { const b = $('#cu-bar'), t = $('#cu-txt'); if (b) { b.style.width = (f * 100).toFixed(1) + '%'; t.textContent = `${Math.round(f * 100)}% · tick ${n(done)} of ${n(owed)} · ${((performance.now() - t0) / 1000).toFixed(1)}s`; } });

}
function showAway(b, owed, skipped, ms) {
  const E = S.E, p = E.player(), a = snapshot();
  const notes = []; for (const x of p.notes || []) { if (b.notes && x.time === b.notes.time && x.text === b.notes.text) break; notes.push(x); if (notes.length > 10) break; }
  const reps = []; for (const id of p.reports || []) { if (id === b.reports) break; const r = E.W.reports[id]; if (r) reps.push(r); }
  const hitsOn = reps.filter(r => r.kind === 'attack' && r.defenderId === p.id);
  sheet(`<h2>☾ While you were away</h2>
    <p class="mute">${dur(owed * TK())} (${n(owed)} ticks) passed in ${esc(D.WORLD.province)}${skipped ? ` (the realm slept through a further ${dur(skipped * TK())}: catch-up is capped at ${CFG.MAX_CATCHUP_TICKS} ticks = 3 days)` : ''}. Simulated in ${(ms / 1000).toFixed(1)}s.</p>
    <div class="stats"><div class="stat"><div class="k">Gold</div><div class="v ${a.gold - b.gold >= 0 ? 'good' : 'bad'}">${a.gold - b.gold >= 0 ? '+' : ''}${n(a.gold - b.gold)}</div></div>

    <p>${hitsOn.length ? `<span class="bad">⚔ ${hitsOn.length} attack${hitsOn.length > 1 ? 's' : ''} on your realm (${hitsOn.filter(r => !r.win).length} repelled).</span>` : '<span class="good">🛡 No one attacked you.</span>'} ${a.unread ? `<br>🐦 ${a.unread} unread raven${a.unread > 1 ? 's' : ''}.` : ''}</p>
    ${notes.length ? `<h3>Missives</h3><ul class="feed">${notes.map(x => `<li class="${x.type}">${esc(x.text)}</li>`).join('')}</ul>` : ''}
    <div class="row" style="margin-top:.8rem"><button class="wide" data-close>Return to the Citadel</button></div>`);

// ---------- loop ----------
function startLoop() {
  if (S.loop) return;
  S.lastTick = S.E ? S.E.W.tick : -1;
  S.loop = setInterval(tickLoop, 1000);
  S.autosave = setInterval(() => save(), 30000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); else if (S.E && !S.catching) catchUp(false); });
  window.addEventListener('pagehide', () => save(true));
  window.addEventListener('pageshow', e => { if (e.persisted && S.E) catchUp(false); });
}
function tickLoop() {
  const E = S.E; if (!E || S.catching || document.hidden) return;
  const owed = E.targetTick(Date.now()) - E.W.tick;
  if (owed > 30) return catchUp(false);
  if (owed > 0) {
    E.runSync(E.W.tick + owed); S.dirty = true;
  }
  if (E.processPending(Date.now())) S.dirty = true;
  updateClock();
  if (E.W.tick !== S.lastTick || S.needRender) {
    S.lastTick = E.W.tick; S.needRender = false;
    renderTop(); renderNav();
    const typing = document.activeElement && document.activeElement.matches('input,textarea,select');
    if (!typing && !$('#sheet') && ['citadel', 'gate'].includes(S.view)) renderView();
    if (S.view === 'tavern') { const o = $('#online-n'); if (o) o.textContent = E.onlineBots().length; }
  }
}

  sheet(`<div class="prof"><div class="realm-head"><img class="pav" src="${avatarUrl(x)}" alt=""><div style="min-width:0"><h2>${esc(t.name)}</h2>

function onChat(m) {
  const E = S.E, me = E.player(), g = E.myGuild();
  if (m.channel.startsWith('guild:') && (!g || m.channel !== 'guild:' + g.id)) return;
  const box = $('#chat');
  if (S.view === 'tavern' && S.chatCh === m.channel && box && !document.hidden) {
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.insertAdjacentHTML('beforeend', msgHtml(m, me));
    while (box.children.length > 140) box.firstElementChild.remove();
    bindNames(box);
    if (near || m.from === me.id) box.scrollTop = box.scrollHeight;
  } else if (m.from !== me.id) {
    S.unread[chKey(m.channel)]++;
    const low = (m.text || '').toLowerCase();
    if (!m.sys && ((me.handle && low.includes(me.handle.toLowerCase())) || low.includes(me.ruler.toLowerCase()))) toast(`💬 ${m.ruler}: ${m.text}`);
    else if (m.channel.startsWith('guild:') && m.sys) toast('⚜ ' + m.text);
    renderNav();
  }
}

function newRaven() {
  sheet(`<h2>Send a raven</h2><label for="nr-q">To which realm?</label><form id="nr-f" class="chatform"><input id="nr-q" type="search" placeholder="Realm, ruler or @name" enterkeyhint="search"><button>Find</button></form><div id="nr-r" class="list" style="margin-top:.5rem"></div>`);
  $('#nr-f').onsubmit = e => {
    e.preventDefault(); const r = S.E.search($('#nr-q').value, 15).filter(x => x.id !== S.E.W.playerId);
    $('#nr-r').innerHTML = r.map(x => `<div class="rk" data-to="${x.id}" role="button"><span class="n"><span class="dot ${x.online ? 'on' : ''}"></span></span><span class="nm"><b>${esc(x.name)}</b><div>${esc(x.ruler)} @${esc(x.handle || '')}</div></span><span class="v">›</span></div>`).join('') || '<p class="mute small">No realm found.</p>';
    bind('[data-to]', b => openThread(b.dataset.to), $('#nr-r'));
  };
}
function openThread(otherId, subject) {
  const E = S.E, me = E.player(), o = E.W.kingdoms[otherId];
  E.markThreadRead(me, otherId); S.dirty = true; renderNav();
  const t = E.mailFor(me).find(x => x.id === otherId), msgs = t ? t.msgs : [];
  const lastSub = t ? t.last.subject : '';
  sheet(`<h2>${o ? nameLink(o.id, o.name) : esc(t ? t.other.name : '?')}</h2>${o ? `<p class="small mute"><span class="dot ${E.isOnline(o) ? 'on' : ''}"></span>${esc(o.ruler)} · ${E.isOnline(o) ? 'online now' : 'offline'}</p>` : ''}
    <div class="thread-msgs" id="th-msgs">${msgs.map(m => `<div class="bub ${m.from === me.id ? 'me' : ''}"><div class="small mute">${esc(m.subject)} · ${ago(m.time)}</div>${esc(m.body)}</div>`).join('') || '<p class="mute small">No letters yet.</p>'}</div>
    ${o ? `<input id="rv-sub" maxlength="80" placeholder="Subject" value="${esc(subject || (lastSub ? (/^re:/i.test(lastSub) ? lastSub : 'Re: ' + lastSub) : ''))}">
    <textarea id="rv-body" rows="3" maxlength="2000" placeholder="Write your letter… (e.g. ask for peace, trade or an invite)"></textarea>
    <button class="gold wide" id="rv-send" style="margin-top:.5rem">Send raven</button>` : ''}`);
  const box = $('#th-msgs'); if (box) box.scrollTop = box.scrollHeight;
  bindNames($('#sheet'));
  bind('#rv-send', () => { const r = act(() => E.mail(me, otherId, $('#rv-sub').value, $('#rv-body').value), { quiet: true, render: S.view === 'ravens' }); if (r) { toast('Your raven takes wing.', 'good'); openThread(otherId); } });
}

    <p class="small pick-desc">${esc((DIFF_INFO[W.difficulty] || DIFF_INFO.medium)[1])}</p></div>
  <div class="panel"><h2>Back up your realm</h2><p class="mute small">Your realm lives only on this device. iOS may clear website data for sites you have not opened in a while, so export a backup now and then (Files, AirDrop or Notes).</p>
    <div class="grid2"><button id="st-exp">⬇ Export file</button><button class="alt" id="st-share">⇪ Share</button></div>
    <button class="alt wide" id="st-copy" style="margin-top:.5rem">Copy save to clipboard</button></div>
  <div class="panel"><h2>Restore</h2><p class="mute small">Load a save file, or paste save text. This replaces the current world.</p>
    <input type="file" id="st-file" accept=".json,application/json,text/plain">
    <textarea id="st-paste" rows="2" placeholder="…or paste save text here"></textarea><button class="alt wide" id="st-imp" style="margin-top:.4rem">Import pasted save</button></div>
  <div class="panel"><h2>Danger</h2><p class="mute small">Reset destroys this world and every rival. Export first if you might want it back.</p><button class="wide" id="st-reset">Reset world</button></div>
  <div class="panel"><h3>Install on iPhone</h3><p class="small mute">In Safari tap Share › Add to Home Screen. It then opens full screen and works with no connection${location.protocol.startsWith('http') ? '' : ' (best when served from a web address, see README)'}.</p></div>`;
  bind('[data-sdiff]', async b => { const d = b.dataset.sdiff; if (d === W.difficulty) return; if (!(await confirmBox(`Switch the province to ${DIFF_INFO[d][0]}?`, 'Switch'))) return; act(() => E.setDifficulty(d)); });
  bind('#st-save', async () => { await save(true); toast('Saved.', 'good'); renderView(); });
  bind('#st-exp', () => { const { json, name } = exportSave(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Save exported.', 'good'); });
  bind('#st-share', async () => {
    const { json, name } = exportSave();
    try { const f = new File([json], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Embergate save' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    toast('Sharing is not available here. Use Export or Copy.', 'err');
  });
  bind('#st-copy', async () => { const { json } = exportSave(); try { await navigator.clipboard.writeText(json); toast('Save copied. Paste it into Notes to keep it.', 'good'); } catch (e) { $('#st-paste').value = json; $('#st-paste').select(); toast('Clipboard blocked: the save is in the box below, copy it manually.', 'err'); } });
  $('#st-file').onchange = e => importFile(e.target.files[0]);
  bind('#st-imp', () => importText($('#st-paste').value));
  bind('#st-reset', async () => { if (!(await confirmBox('Destroy this world and start over?', 'Reset world', true))) return; await resetWorld(); });
}
async function resetWorld() {
  clearInterval(S.loop); clearInterval(S.autosave); S.loop = null;
  await Store.clear(); S.E = null; S.unread = { global: 0, recruit: 0, guild: 0 }; S.view = 'citadel';
  try { history.replaceState(null, '', location.pathname); } catch (e) { }
  closeSheet(); renderCreate();
}
function importFile(f) { if (!f) return; const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(f); }
async function importText(txt) {
  let E; try { E = Engine.fromJSON(String(txt || '').trim()); if (!E.player()) throw new Error('No ruler in that save'); } catch (e) { toast('Not a valid Embergate save: ' + e.message, 'err'); return; }
  if (S.E && !(await confirmBox('Replace your current world with this save?', 'Replace', true))) return;
  clearInterval(S.loop); clearInterval(S.autosave); S.loop = null;
  S.E = E; S.unread = { global: 0, recruit: 0, guild: 0 }; S.view = 'citadel';
  hookEngine(); await save(true); toast('Save restored.', 'good');
  await catchUp(true); startLoop();
}

    <div class="row"><button class="alt" id="pf-up" style="flex:1">📷 Upload image</button><button class="alt" id="pf-rm" ${me.avatar ? '' : 'disabled'}>Remove</button></div>
    <input type="file" id="pf-file" accept="image/*" style="display:none">
    <p class="small mute">Any photo works: it is cropped to a square and shrunk to 256×256 on this device.</p>
    <label for="pf-bio">Bio</label><textarea id="pf-bio" rows="4" maxlength="300" placeholder="Tell the province who you are…">${esc(me.bio || '')}</textarea>
    <div class="row nw"><span class="small mute" id="pf-cnt">${(me.bio || '').length}/300</span><span class="spacer"></span><button class="gold" id="pf-save">Save bio</button></div></div>
  <div class="panel"><h3>How others see you</h3><div class="msg" style="max-width:none">${av(me)}<div class="mb"><div class="who"><b>${esc(me.ruler)}</b> <span class="mute">${esc(me.name)}</span></div><div class="tx">${me.bio ? esc(me.bio) : '<span class="mute">No bio yet.</span>'}</div></div></div></div>`;
  const bio = $('#pf-bio');
  bio.oninput = () => { $('#pf-cnt').textContent = bio.value.length + '/300'; };
  bind('#pf-save', () => act(() => E.setProfile(me, { bio: bio.value })));
  bind('#pf-rm', () => act(() => E.setProfile(me, { avatar: null })));
  bind('#pf-up', () => $('#pf-file').click());
  $('#pf-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const url = await resizeImage(f, 256); act(() => E.setProfile(me, { avatar: url })); await save(true); }
    catch (err) { toast('Could not read that image: ' + err.message, 'err'); }
  };
}
function resizeImage(file, size) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
        const s = Math.min(im.naturalWidth, im.naturalHeight), sx = (im.naturalWidth - s) / 2, sy = (im.naturalHeight - s) / 2;
        g.fillStyle = '#111'; g.fillRect(0, 0, size, size); g.imageSmoothingQuality = 'high';
        g.drawImage(im, sx, sy, s, s, 0, 0, size, size);
        let q = 0.82, out = c.toDataURL('image/jpeg', q);
        while (out.length > 150000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url); res(out);
      } catch (e) { rej(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unsupported image')); };
    im.src = url;
  });
}

// ---------- debug / test hooks ----------
window.EG = {
  get E() { return S.E; }, S, version: VERSION,
  debug: {
    advance(ticks) { S.E.W.epoch -= ticks * CFG.TICK_MS; return catchUp(false); },
    tick() { S.E.W.epoch -= CFG.TICK_MS; return tickLoop(); },
    flush() { const now = Date.now(); for (const p of S.E.W.pending) p.due = Math.min(p.due, now); const r = S.E.processPending(Date.now()); render(); return r; },
    go, render, save: () => save(true), errors: S.errors
  }
};

window.EG_HANDLES_UPDATE = true;
window.addEventListener('eg-update', async () => {
  try { toast('⚜ Updating Embergate… your realm is saved first.', 'good'); for (let i = 0; i < 300 && S.catching; i++) await new Promise(r => setTimeout(r, 100)); if (S.E) await save(true); } catch (e) { }
  location.reload();
});
sideArt();
boot();
})();
